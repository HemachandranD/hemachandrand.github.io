<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Hemachandran Dhinakaran — Enterprise AI Engineer</title>
    <!-- GitHub Pages SPA fallback (rafgraph/spa-github-pages):
         encode the requested path into a query string and bounce to /,
         where index.html restores it before the app boots. -->
    <script>
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
